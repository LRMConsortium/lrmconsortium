<!-- LRMC LOADER — two kinds, and the choice matters.

     Skeleton: use when you know the shape of what is coming. It holds the
     layout still, so the page does not jump when data lands.

     Spinner: use only when the shape is unknown, or inside a button. -->

<div class="space-y-3">
  <div class="lrmc-skeleton h-4 w-1/3"></div>
  <div class="lrmc-skeleton h-4 w-full"></div>
  <div class="lrmc-skeleton h-4 w-4/5"></div>
</div>

<span class="htmx-indicator inline-flex items-center gap-2 text-xs text-ink-400">
  <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Loading…
</span>

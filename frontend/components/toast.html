<!-- LRMC TOAST — raised from script: LrmcUI.toast('Saved', 'success')

     role="status" for ordinary messages, role="alert" for errors, so a
     screen reader interrupts for the one that matters and does not for the
     one that does not. LrmcUI.toast picks the right one. -->
<div class="lrmc-toast lrmc-toast-success" role="status">
  <i data-lucide="check-circle" class="w-4 h-4 text-success flex-shrink-0 mt-0.5"></i>
  <span>Saved.</span>
</div>

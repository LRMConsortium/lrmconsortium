<!-- LRMC TOPBAR — the dashboard header.

     Holds the sidebar toggle on small screens, the page title, and account
     controls. The title is an <h1> and there is exactly one per page. -->
<header class="h-16 bg-white backdrop-blur border-b border-slate-200
               flex items-center gap-4 px-4 lg:px-6 sticky top-0 z-20">

  <button type="button" @click="toggle()"
          class="lg:hidden lrmc-btn lrmc-btn-ghost !min-h-0 !p-2"
          aria-label="Toggle navigation" aria-controls="lrmc-sidebar">
    <i data-lucide="menu" class="w-5 h-5"></i>
  </button>

  <div class="min-w-0 flex-1">
    <h1 class="text-base font-bold text-slate-900 truncate">Page title</h1>
    <p class="text-xs text-slate-400 truncate">Legacy Rental Management Consortium</p>
  </div>

  <!-- Unread count is a number in text, not a bare coloured dot: a dot alone
       says "something" and never says "how many". -->
  <button type="button" class="lrmc-btn lrmc-btn-ghost !min-h-0 !p-2 relative"
          aria-label="Notifications">
    <i data-lucide="bell" class="w-5 h-5"></i>
    <span id="lrmc-unread"
          class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full
                 bg-gold-500 text-white text-[10px] font-bold
                 flex items-center justify-center lrmc-num hidden"></span>
  </button>
</header>

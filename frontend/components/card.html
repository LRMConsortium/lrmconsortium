<!-- LRMC CARD — the default container for a panel of content.
     Copy the block, replace title and body. `lrmc-card-institutional` adds
     the gold border reserved for Founder Command Center surfaces. -->
<section class="lrmc-card">
  <header class="lrmc-card-header">
    <h2 class="lrmc-card-title">Card title</h2>
    <button type="button" class="lrmc-btn lrmc-btn-ghost lrmc-btn-sm">Action</button>
  </header>
  <div class="text-sm text-slate-700">
    Card body.
  </div>
</section>

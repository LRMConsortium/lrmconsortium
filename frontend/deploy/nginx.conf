# ═══════════════════════════════════════════════════════════════════════════
# LRMC — nginx
#
# Two C4 servers in The Gambia, several domains: lrmconsortium.com,
# lrmconsortium.africa, and africaususu.com for the rideshare.
#
# The static pages are files; the API is Node behind a proxy. Everything below
# is about keeping those two clearly separated and making the failure modes
# visible rather than silent.
#
# ── Two markets, two upstream ports ───────────────────────────────────────
# LRMC runs one code line as two independent deployments: The Gambia on 4000
# and the US pilot (Casper, WY) on 4100. The ports are declared once, in
# `backend/src/config/markets.ts`, and this file is checked against that
# registry by `npm run verify` and by `npm run preflight`. A port changed here
# and not there — or there and not here — is a 502 on every API call with
# nothing in either file looking wrong.
#
# The two markets share nothing: separate database, separate Stripe account,
# separate `.env`, separate release directory. They appear in one file for the
# same reason they appear in one `ecosystem.config.cjs` — one file is easier to
# read than two — and DNS is what keeps them apart in operation: the US names
# resolve only to the US host, so on the Gambia host the pilot's block exists
# and is never reached.
#
# ── Roots point into the release, not beside it ───────────────────────────
# Every `root` below is `/srv/lrmc/<short>/current/frontend`, which is the
# symlink `deploy/release.sh` moves. That matters more here than it looks:
# `build-public-pages.py` writes the pricing, fees and currency for **one**
# market into these files at build time. A root outside the release would serve
# whatever was copied there by hand the first time — which is to say it would
# quote Casper in dalasi, indefinitely, and a rollback would not undo it either.
#
# ── Read this before changing the SPA fallback ────────────────────────────
# There is deliberately NO catch-all `try_files … /index.html`. LRMC's frontend
# is a set of real pages, not a single-page app, and a blanket fallback turns
# every typo and every dead link into a 200 serving the wrong page. A person
# who mistypes a URL should get a 404 they can recognise; a monitoring system
# should see a 404 rather than a 200. The one place a fallback is right is
# `/api/`, and there it is a 404 in JSON so a client's error handling works.
# ═══════════════════════════════════════════════════════════════════════════

# ── Rate limiting ──────────────────────────────────────────────────────────
# A first line only. The application has its own limiter (`globalRateLimit`,
# `authRateLimit`) which knows about accounts; this one knows about addresses
# and exists to keep obvious floods off the Node process entirely.
#
# `$binary_remote_addr` rather than `$remote_addr`: a quarter of the memory,
# and these zones live for the life of the process.
limit_req_zone  $binary_remote_addr  zone=lrmc_general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=lrmc_auth:10m     rate=1r/s;
limit_conn_zone $binary_remote_addr  zone=lrmc_conn:10m;

# Real client addresses. Without this every request appears to come from the
# load balancer and per-IP limiting silently protects nothing.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ── Logging ────────────────────────────────────────────────────────────────
# `$request_time` and `$upstream_response_time` are both here on purpose: the
# difference between them is time spent on the network rather than in the
# application, which on Gambian mobile data is most of it. A log with only the
# second would make the platform look faster than members experience it.
log_format lrmc '$remote_addr $host "$request" $status $body_bytes_sent '
                'rt=$request_time urt=$upstream_response_time '
                'rid=$http_x_request_id ua="$http_user_agent" ref="$http_referer"';

access_log /var/log/nginx/lrmc.access.log lrmc buffer=32k flush=5s;
error_log  /var/log/nginx/lrmc.error.log warn;

# ── HTTP: redirect, and nothing else ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lrmconsortium.com www.lrmconsortium.com
                lrmconsortium.africa www.lrmconsortium.africa
                africaususu.com www.africaususu.com
                us.lrmconsortium.com www.us.lrmconsortium.com;

    # The one exception. ACME has to answer over plain HTTP or the certificate
    # cannot be renewed, and a redirect here is how a certificate silently
    # expires ninety days after somebody stops watching.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name lrmconsortium.com www.lrmconsortium.com
                lrmconsortium.africa www.lrmconsortium.africa;

    ssl_certificate     /etc/letsencrypt/live/lrmconsortium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lrmconsortium.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:LRMC_SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── HSTS ───────────────────────────────────────────────────────────────
    # Two years, subdomains included, preload-eligible.
    #
    # `preload` is a commitment, not a flag: once the domain is on the browser
    # preload list, removing it takes months. Add it only when every subdomain
    # — including any staging or admin host — is certain to be HTTPS forever.
    # It is set here because LRMC has no plaintext subdomain and no intention
    # of acquiring one.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # `always` on every one of these. Without it nginx omits the header on 4xx
    # and 5xx responses — which are exactly the responses an attacker is
    # trying to produce.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    # Neither the API nor the member portal should ever be indexed. The public
    # pages set their own `robots` meta; this is the backstop for everything
    # behind a session.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The release symlink, not a path beside it. See the header.
    root /srv/lrmc/gm/current/frontend;
    index index.html;
    charset utf-8;

    # 2MB matches `express.json({ limit: '2mb' })`. A larger limit here means
    # the Node process receives bodies it will refuse, which is work done twice
    # and a slower refusal.
    client_max_body_size 2m;
    client_body_timeout  30s;
    limit_conn lrmc_conn 40;

    # ── Compression ────────────────────────────────────────────────────────
    # `bundle.production.sh` writes `.gz` and `.br` beside every text asset, so
    # the expensive part happens once at build time rather than per request.
    # Brotli at quality 11 is meaningfully smaller than gzip on this kind of
    # text and is worth the extra file on a connection this slow.
    #
    # `_static` serves the pre-built file when the client accepts it. The
    # on-the-fly settings below remain as the fallback for anything the build
    # did not compress — an image variant, a file added by hand.
    gzip_static       on;
    brotli_static     on;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;

    # ── The API ────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=lrmc_general burst=40 nodelay;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application reads this to decide whether it is behind TLS. Without
        # it, secure-cookie and redirect logic sees plain HTTP and misbehaves.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";

        # Long enough for a slow aggregation, short enough that a wedged
        # request does not hold a worker for a minute.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # An API response is never cached by an intermediary. A stale
        # `/auth/me` served from a proxy is one member seeing another's session.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Credential endpoints get their own, much tighter bucket. The application
    # also locks an account after repeated failures; this stops the attempt
    # reaching the password hasher in the first place, which is the expensive
    # part of a credential-stuffing run.
    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=lrmc_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        add_header Cache-Control "no-store" always;
    }

    # Health checks: no rate limit, no log. A probe every five seconds would
    # otherwise be most of the access log.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:4000/healthz;
    }

    # ── Static ─────────────────────────────────────────────────────────────
    # Fingerprinted assets are immutable. These are not fingerprinted yet, so a
    # week with `must-revalidate` rather than a year: a member on a slow
    # connection benefits from the cache, and a deploy still reaches them.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }

    # Vendored third-party libraries carry a version in the filename upstream
    # and change only when somebody deliberately re-vendors them.
    location /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # ── Hashed assets ──────────────────────────────────────────────────────
    # `bundle.production.sh` puts the content hash in every filename, so the
    # bytes at a given path can never change. A year, immutable, and no
    # revalidation — which on a slow connection is the difference between
    # paying for the chrome once and paying for it weekly.
    #
    # More specific than the `/assets/` block above, so it wins for anything
    # that looks like `name.HASH.ext`.
    location ~* ^/assets/(css|js|vendor)/.+\.[A-Za-z0-9]{8,}\.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Pages ──────────────────────────────────────────────────────────────
    # `/members/payments` serves `/members/payments.html`, and anything that is
    # genuinely missing is a 404. See the note at the top of this file for why
    # there is no catch-all fallback.
    location / {
        limit_req zone=lrmc_general burst=20 nodelay;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # A 5xx from the API must not render as an nginx default page inside what
    # the member thinks is LRMC.
    error_page 500 502 503 504 /500.html;
    location = /500.html { internal; }
}

# ── Ususu rideshare ────────────────────────────────────────────────────────
# Its own certificate and its own root, sharing the API. Kept as a separate
# server block rather than another `server_name` on the one above, because the
# two services will diverge and a shared block is where that divergence turns
# into an accident.
#
# Gambia's API, on 4000, deliberately: Ususu launches with the Gambia market.
# When the pilot gets a rideshare surface it gets its own block on 4100, and it
# is not a `server_name` added here — see above.
#
# NOTE: this root is the one path in this file that is not inside a release.
# `build-public-pages.py` does not produce an Ususu tree yet, so those files are
# placed by hand and are not rolled back with the rest. Said plainly rather than
# pointed at a directory the release does not create.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name africaususu.com www.africaususu.com;

    ssl_certificate     /etc/letsencrypt/live/africaususu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/africaususu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /srv/lrmc/ususu;
    index index.html;

    location /api/ {
        limit_req zone=lrmc_general burst=40 nodelay;
        proxy_pass       http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# ── The US pilot — Casper, Wyoming ─────────────────────────────────────────
#
# A separate deployment on port 4100, with its own database, its own Stripe
# account and its own release directory. Nothing below is shared with the
# Gambia block above except the rate-limit zones, which are per-address and
# per-nginx-process rather than per-market.
#
# ── Why this is a duplicate rather than an `include` ──────────────────────
# The obvious tidy-up is to lift the proxy headers and the security headers
# into `proxy_params` and include them in both. It was not done, because the
# suite already reads *this file* for every one of those headers, and moving
# them behind an include would mean the assertions pass while reading a file
# that no longer says anything.
#
# The drift that an include would prevent is instead **asserted**: `verify.ts`
# compares the two markets' blocks header by header and fails if one carries a
# security header or a forwarded header the other does not. That catches the
# case the include was for — somebody tightening one block and forgetting the
# other — which an include only makes less likely.
#
# ── The one value here that is a choice, not a fact ───────────────────────
# `us.lrmconsortium.com`. The port comes from the market registry, the root
# from the release layout, the headers from the block above. The hostname is
# the pilot's and nobody has confirmed it. If it changes, it changes in three
# places: here, the certificate path, and the port-80 redirect at the top.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name us.lrmconsortium.com www.us.lrmconsortium.com;

    ssl_certificate     /etc/letsencrypt/live/us.lrmconsortium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us.lrmconsortium.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:LRMC_US_SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The release symlink for this market. `build-public-pages.py` wrote USD
    # prices and a 10% management fee into these files; the Gambia release
    # directory holds the same filenames with dalasi in them.
    root /srv/lrmc/us/current/frontend;
    index index.html;
    charset utf-8;

    client_max_body_size 2m;
    client_body_timeout  30s;
    limit_conn lrmc_conn 40;

    gzip_static       on;
    brotli_static     on;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;

    # ── The API ────────────────────────────────────────────────────────────
    # 4100. `backend/src/config/markets.ts` is where that number is decided;
    # `npm run preflight` refuses a release whose `.env` disagrees with it.
    location /api/ {
        limit_req zone=lrmc_general burst=40 nodelay;

        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=lrmc_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        add_header Cache-Control "no-store" always;
    }

    # Its own health endpoint on its own port. `release.sh` and `rollback.sh`
    # poll 127.0.0.1 directly, so this one is for external monitoring.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:4100/healthz;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/assets/(css|js|vendor)/.+\.[A-Za-z0-9]{8,}\.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # No catch-all fallback here either. See the note at the top of this file.
    location / {
        limit_req zone=lrmc_general burst=20 nodelay;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /500.html;
    location = /500.html { internal; }
}

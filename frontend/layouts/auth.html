<!DOCTYPE html>
<!--
 LEGACY RENTAL MANAGEMENT CONSORTIUM (LRMC) — AUTH LAYOUT

 Sign in, register, password reset. One centred card, nothing else on screen.
 No navigation on purpose: a person on this page has exactly one job, and
 every link away from it is a way to fail at that job.
-->
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Legacy Rental Management Consortium</title>

  <link rel="icon" href="/assets/img/lrmc-favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        /* LRMC branding-locked palette */
        lrmc: { blue:'#1E3A8A', gold:'#D4AF37', slate:'#334155' },
        blue: { 100:'#DBEAFE', 300:'#93C5FD', 500:'#3B82F6', 600:'#2563EB', 700:'#1D4ED8', 800:'#1E3A8A', 900:'#172554' },
        slate:{ 50:'#F8FAFC', 100:'#F1F5F9', 200:'#E2E8F0', 300:'#CBD5E1', 400:'#94A3B8', 500:'#64748B', 700:'#334155', 800:'#1E293B', 900:'#0F172A' },
        emerald:{ 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 600:'#059669', 700:'#047857' },
        amber:{ 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 600:'#D97706', 700:'#B45309' },
        rose:{ 50:'#FFF1F2', 100:'#FFE4E6', 600:'#E11D48', 700:'#BE123C' },
        gold: { 100:'#FBF6E5', 500:'#D4AF37', 700:'#8A6D1C' },
      },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } } };
  </script>

  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/utilities.css" />

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="/assets/js/sdk.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>

<body class="h-full antialiased flex flex-col items-center justify-center p-4">

  <main id="lrmc-main" class="w-full max-w-sm">

    <div class="flex flex-col items-center mb-8">
      <img src="/assets/img/lrmc-logo.png" alt=""
           class="w-24 h-24 mb-3 rounded-xl object-contain" />
      <p class="text-lg font-extrabold text-gold-500 tracking-wide">LRMC</p>
      <p class="text-[11px] text-slate-400 text-center mt-1">Legacy Rental Management Consortium</p>
    </div>

    <div class="lrmc-card">
      <!-- SLOT: the form -->
    </div>

    <p class="text-[11px] text-slate-400 text-center mt-6">
      © <span class="lrmc-year"></span> Legacy Rental Management Consortium · Accra, Ghana
    </p>
  </main>

  <div id="lrmc-toasts" aria-live="polite" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

  <script>
    document.querySelectorAll('.lrmc-year').forEach(function (el) { el.textContent = new Date().getFullYear(); });
    document.addEventListener('DOMContentLoaded', function () { if (window.lucide) window.lucide.createIcons(); });
  </script>
</body>
</html>

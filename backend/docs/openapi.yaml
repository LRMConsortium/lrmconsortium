            - hostConfirmation
            - rentalAgreement
            - tenantIntake
            - propertyOwnership
            - employmentVerification
            - incomeProof
            - maritalStatus
            - birthRecord
            - criminalBackground
            - driverLicence
            - vehicleInsurance
            - roadworthiness
            - businessRegistration
            - taxClearance
        rule:
          anyOf:

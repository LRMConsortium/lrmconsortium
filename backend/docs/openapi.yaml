              pattern: ^[a-f\d]{24}$
            reason:
              anyOf:
                - type: string
                - type: 'null'
            requirements:
              '$ref': '#/components/schemas/TransitionRequirements'
          required:
            - from
            - to
            - action
            - at
            - actor
        audit:
          '$ref': '#/components/schemas/DocumentAuditSummary'
      required:
        - document
        - transition
        - audit
    DocumentVerificationSummary:
      type: object
      description: Lifecycle, score, compliance and expiry in one read. A reviewer deciding whether to verify needs all four, and four round trips to assemble them is four chances to act on a stale one.
      properties:
        documentId:
          type: string
          pattern: ^[a-f\d]{24}$
        reference:
          type: string
        type:
          type: string
          enum:
            - identity
            - proofOfResidency
            - hostConfirmation
            - rentalAgreement
            - tenantIntake
            - propertyOwnership
            - employmentVerification
            - incomeProof
            - maritalStatus
            - birthRecord
            - criminalBackground
            - driverLicence
            - vehicleInsurance
            - roadworthiness
            - businessRegistration
            - taxClearance
        lifecycle:
          type: object
          properties:
            status:
              type: string
              enum:
                - submitted
                - underReview
                - needsMoreInfo
                - verified
                - rejected
                - expired
            submittedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            reviewStartedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            verifiedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            rejectedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            expiredAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            reviewable:
              type: boolean
            desk:
              type: string
              enum:
                - backOffice
                - coordinator
                - hqExecutive
          required:
            - status
            - reviewable
        score:
          '$ref': '#/components/schemas/DocumentScore'
        compliance:
          '$ref': '#/components/schemas/DocumentComplianceReport'
        expiry:
          '$ref': '#/components/schemas/DocumentExpiryInfo'
        audit:
          type: array
          items:
            '$ref': '#/components/schemas/DocumentAudit'
        auditSummary:
          '$ref': '#/components/schemas/DocumentAuditSummary'
        verifiable:
          type: boolean
          description: The AND of reviewable, compliance-clear, above the score floor and not expired.
      required:
        - documentId
        - type
        - lifecycle
        - score
        - compliance
        - expiry
        - verifiable
    DocumentAnalytics:
      type: object
      description: Verification throughput and backlog across the platform.
      properties:
        window:
          type: object
          properties:
            from:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            to:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
        total:
          type: integer
          minimum: 0
        byStatus:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        byType:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        byDesk:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        backlog:
          type: integer
          minimum: 0
          description: Submitted plus under review — what a desk still owes.
        awaitingHolder:
          type: integer
          minimum: 0
        verified:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        verificationRate:
          type: number
          minimum: 0
          maximum: 100
        rejectionRate:
          type: number
          minimum: 0
          maximum: 100
        averageScore:
          type: number
          minimum: 0
          maximum: 100
        averageTurnaroundHours:
          type: number
          minimum: 0
        expiringSoon:
          type: integer
          minimum: 0
        expired:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True when the sample hit its cap. Reported, never silent.
      required:
        - total
        - byStatus
        - backlog
        - verificationRate
        - rejectionRate
    SubmitDocumentRequest:
      type: object

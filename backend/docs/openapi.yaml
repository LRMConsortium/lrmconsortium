      properties:
        generation:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
            - superseded
            - none
        issuedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        daysRemaining:
          anyOf:
            - type: integer
            - type: 'null'
        health:
          type: string
          enum:
            - active
            - expiringSoon
            - expired
        warning:
          type: boolean
        description:
          type: string
        rotationDays:
          type: integer
          minimum: 1
      required:
        - status
        - health
        - description
    FacAttemptState:

          type: string
          description: The role the filter was applied for, or "anonymous".
        endpoints:
          type: array
          items:
            '$ref': '#/components/schemas/BlueprintEndpoint'
        scopes:
          type: object
          additionalProperties:
            type: object
            properties:
              ownerPath:
                type: string
              organizationPath:
                type: string
              describes:
                type: string
        zones:
          type: array
          items:
            '$ref': '#/components/schemas/HQZone'
    OpenApiDocument:
      type: object
      description: This document. Returned raw, not enveloped — a spec inside an envelope is not readable by any tool.
      properties:
        openapi:
          type: string
          const: 3.1.0
        info:
          type: object
        servers:
          type: array
          items:
            type: object
        paths:
          type: object
        components:
          type: object

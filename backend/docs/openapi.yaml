    FacCode:
      allOf:
        - '$ref': '#/components/schemas/LifecycleFields'
        - type: object
          description: 'One generation of the Founder Authorisation Code. The code itself is never stored — only a bcrypt digest, which is `select: false` and stripped from every serialised body.'
          properties:
            _id:
              type: string
              pattern: ^[a-f\d]{24}$
            generation:
              type: integer
              minimum: 1
              readOnly: true
              description: Monotonic. Generation 1 is the first ever issued.
            label:
              type: string
              maxLength: 120
              description: A hint the founder chose. Never part of the code.
            issuedBy:
              type: string
              pattern: ^[a-f\d]{24}$
            issuedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            rotationDays:
              type: integer
              minimum: 1
            trigger:
              type: string
              enum:
                - scheduled
                - roleChange
                - manual
                - compromise
                - lockoutThreshold
            revokedAt:
              type: string
              format: date-time
            revokedBy:
              type: string
              pattern: ^[a-f\d]{24}$
            revocationReason:
              type: string
              maxLength: 1000
            supersededBy:
              type: string
              pattern: ^[a-f\d]{24}$
            successfulVerifications:
              type: integer
              minimum: 0
              readOnly: true
            failedVerifications:
              type: integer
              minimum: 0
              readOnly: true
            status:
              type: string
              enum:
                - active
                - expired
                - revoked
                - superseded
              readOnly: true
          required:
            - generation
            - issuedBy
            - issuedAt
            - expiresAt
            - status
    FacCodeList:
      type: array
      items:
        '$ref': '#/components/schemas/FacCode'
    IssueFacCodeRequest:
      type: object
      description: No code may be supplied. The server generates it from a CSPRNG and rejection-samples against the weakness rules — a founder allowed to choose six digits will choose their birthday.
      properties:
        trigger:
          type: string
          enum:
            - scheduled
            - roleChange
            - manual
            - compromise
            - lockoutThreshold
        rotationDays:
          type: integer
          minimum: 1
          maximum: 365
        label:
          type: string
          maxLength: 120
        reason:
          type: string
          maxLength: 1000
          description: Required when the trigger is `compromise`.
    FacIssuance:
      type: object
      description: The one and only time the plaintext code is returned. There is no endpoint that retrieves it again and no support procedure that recovers it.
      properties:
        code:
          type: string
          description: The plaintext code. Shown once. Not recoverable.
        issuedOnce:
          type: boolean
        warning:
          type: string
        generation:
          type: integer
          minimum: 1
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        rotationDays:
          type: integer
          minimum: 1
        trigger:
          type: string
          enum:
            - scheduled
            - roleChange
            - manual
            - compromise
            - lockoutThreshold
        supersededGeneration:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        clearancesRevoked:
          type: boolean
          description: True when the trigger also closed every live clearance.
      required:
        - code
        - generation
        - issuedAt
        - expiresAt
        - warning
    RevokeFacCodeRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      required:
        - reason
    ClearLockoutRequest:
      type: object
      description: The reason is mandatory. An optional free-text field on a security override is left empty every time, and six months later nobody can reconstruct why the highest authority on the platform was let back in.
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
      required:
        - reason
    FacRevocation:
      type: object
      description: Revoking without replacing leaves no code in force. Zone A is then closed to everyone and governance health is capped — the intended outcome for a suspected compromise.
      properties:
        generation:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
            - superseded
        revokedAt:
          type: string
          format: date-time
        revocationReason:
          type: string
        clearancesRevoked:
          type: integer
          minimum: 0
        warning:
          type: string
      required:
        - generation
        - status
        - clearancesRevoked
    FacCodeSummary:
      type: object

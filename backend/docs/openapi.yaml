openapi: 3.1.0
info:
  title: LRMC + Ususu Unified API
  version: 1.0.0
  description: |-
    Legacy Rental Management Consortium + Ususu Rideshare unified African institutional platform. Includes HQ zones, member portal, public portal, commercial clients, and advertising.

    Route convention: **plural for collections, singular for items** — `/landlords` for the set, `/landlord/{landlordId}` for the one.

    Every authenticated request passes three gates: zone (`x-zone`), permission (`x-permissions`), then ownership (`x-ownership`). `x-roles` lists the roles that clear all three; it is computed from the RBAC configuration, not hand-maintained.

    All responses are enveloped: `{ success, data, meta? }` or `{ success: false, error }`.
servers:
  - url: https://api.lrmconsortium.africa/api/v1
    description: LRMC HQ (Institutional Command Center)
  - url: https://api.lrmconsortium.com/api/v1
    description: LRMC Public Portal
  - url: https://api.africalrmc.com/api/v1
    description: LRMC PR & Communications
  - url: https://api.africaususu.com/api/v1
    description: Ususu Rideshare Platform
  - url: http://localhost:3000/api/v1
    description: Local Development
tags:
  - name: hqInitModule
  - name: platform
    description: Index and the live machine-readable contract.
  - name: auth
    description: Registration, sessions, the caller’s own authorisation picture, and Founder appointment.
  - name: hq
    description: HQ zone directory, executive dashboards, and the Zone A audit trail.
  - name: property
    description: 'Properties: rentals, short-lets, hotel rooms and resort villas.'
  - name: coordinator
    description: Coordinators — the LRMC field officers.
  - name: driver
    description: Ususu drivers.
  - name: rentalCarCompany
    description: Rental car companies and their fleets.
  - name: advertising
    description: Ad serving, tracking, lifecycle and Founder policy.
  - name: publicPortal
    description: Public content, traffic and conversion metrics.
  - name: lease
    description: 'Leases: the contract between a landlord and a tenant, and the rent recorded against it.'
  - name: maintenance
    description: Maintenance work orders, vendor assignment and property history.
  - name: ride
    description: 'Ususu ride dispatch: request, accept, start, complete, cancel.'
  - name: payment
    description: The single money ledger — rent, deposits, fares, payouts, ad spend, fees and refunds.
  - name: notification
    description: Push token registration, member inboxes and HQ test sends.
  - name: commercialClient
    description: 'Commercial client accounts: the contracting entity above the operational profiles.'
  - name: payout
    description: 'Outbound transfer batches: built by Back Office from the ledger, released by the Founder.'
  - name: fac
    description: The Founder Authorisation Code — issuance, verification, lockout and the attempt ledger. Sits in front of Zone A.
  - name: governance
    description: Governance tiers, the seal visibility matrix, and institutional health.
  - name: document
    description: 'The Document Engine: submission, review, compliance, scoring, expiry and the append-only audit trail.'
  - name: organization
  - name: founder
    description: Founder profile — Zone A.
  - name: hqExecutive
    description: HQ executive profiles.
  - name: backOfficeStaff
    description: Back office staff records — Zone C.
  - name: landlord
    description: Landlords.
  - name: tenant
    description: Tenants.
  - name: vendor
    description: Vendors.
  - name: airbnbHost
    description: Airbnb hosts.
  - name: hotel
    description: Hotels.
  - name: resort
    description: Resorts.
  - name: rider
    description: Ususu riders.
  - name: advertiser
    description: Advertiser accounts.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PageMeta:
      type: object
      description: Pagination metadata returned alongside every list response.
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev
    ErrorResponse:
      type: object
      description: Every failure, in one shape.
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - ZONE_RESTRICTED
                - NOT_FOUND
                - CONFLICT
                - DUPLICATE_KEY
                - UNPROCESSABLE
                - RATE_LIMITED
                - LOCKED
                - POLICY_VIOLATION
                - INTERNAL
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                  - message
          required:
            - code
            - message
      required:
        - success
        - error
    ContactFields:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^\+?[0-9]{7,15}$
        WhatsApp:
          type: string
          pattern: ^\+?[0-9]{7,15}$
        preferredContactMethod:
          type: string
          enum:
            - phone
            - whatsapp
            - email
            - sms
            - inApp
          default: whatsapp
        profilePhoto:
          type: string
      required:
        - email
        - phone
    IdentityFields:
      type: object
      description: National identity. Never returned by the API.
      properties:
        IDType:
          type: string
          enum:
            - ghanaCard
            - passport
            - driversLicense
            - votersId
            - nationalId
            - ssnit
            - other
        IDNumber:
          type: string
          writeOnly: true
        IDPhoto:
          type: string
          writeOnly: true
        nationalID:
          type: string
          writeOnly: true
        nationalIDPhoto:
          type: string
          writeOnly: true
    LocationFields:
      type: object
      properties:
        nationality:
          type: string
        residenceCountry:
          type: string
          default: Ghana
        address:
          type: string
        city:
          type: string
        region:
          type: string
    EmergencyContactFields:
      type: object
      properties:
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
          pattern: ^\+?[0-9]{7,15}$
        emergencyContactRelationship:
          type: string
    VerificationFields:
      type: object
      properties:
        verificationStatus:
          type: string
          enum:
            - unsubmitted
            - pending
            - inReview
            - verified
            - rejected
            - suspended
          default: unsubmitted
          readOnly: true
        verifiedAt:
          type: string
          format: date-time
          readOnly: true
        verifiedBy:
          type: string
          pattern: ^[a-f\d]{24}$
          readOnly: true
        rejectionReason:
          type: string
          readOnly: true
    LifecycleFields:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f\d]{24}$
          readOnly: true
        user:
          type: string
          pattern: ^[a-f\d]{24}$
          description: Owning User account.
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
            - suspended
            - archived
          default: active
        deletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Set when archived.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    RatingFields:
      type: object
      properties:
        rating:
          type: number
          minimum: 0
          maximum: 5
          readOnly: true
        ratingCount:
          type: integer
          minimum: 0
          readOnly: true
    Organization:
      type: object
      description: LRMC organization and its institutional configuration.
      properties:
        id:
          type: string
          pattern: ^[a-f\d]{24}$
          readOnly: true
        name:
          type: string
        country:
          type: string
        currency:
          type: string
        hqZone:
          type: string
        regions:
          type: array
          items:
            type: string
        managementFeePercent:
          type: number
          minimum: 0
          maximum: 100
        rideCommissionPercent:
          type: number
          minimum: 0
          maximum: 100
        branding:
          type: object
          properties:
            primaryColor:
              type: string
            secondaryColor:
              type: string
            accentColor:
              type: string
            logoUrl:
              type: string
        locale:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - country
        - currency
        - hqZone
        - regions
        - managementFeePercent
        - rideCommissionPercent
        - locale
        - timezone
    HQInitResponse:
      type: object
      description: The initial HQ structure created for an organization.
      properties:
        id:
          type: string
          pattern: ^[a-f\d]{24}$
          readOnly: true
        organizationId:
          type: string
          pattern: ^[a-f\d]{24}$
        founderProfileId:
          type: string
          pattern: ^[a-f\d]{24}$
        hqCode:
          type: string
        hqName:
          type: string
        zones:
          type: array
          items:
            type: string
        surfaces:
          type: object
          additionalProperties:
            type: boolean
        regionStructure:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - organizationId
        - founderProfileId
        - hqCode
        - hqName
        - zones
    Founder:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - type: object
          description: Founder profile — Zone A. The constitutional record of the consortium.
          properties:
            fullName:
              type: string
              maxLength: 160
            founderTitle:
              type: string
              default: Founder & Chief Custodian
            bio:
              type: string
              maxLength: 5000
            missionStatement:
              type: string
              maxLength: 3000
            visionStatement:
              type: string
              maxLength: 3000
            coreValues:
              type: array
              items:
                type: string
            policyAuthorityLevel:
              type: string
              enum:
                - absolute
                - delegatedReview
                - boardRatified
            regionsOverseen:
              type: array
              items:
                type: string
            serviceLinesOverseen:
              type: array
              items:
                type: string
            systemAccessScope:
              type: string
              enum:
                - global
                - regional
            commandZones:
              type: array
              items:
                type: string
            successionContact:
              type: string
            securityNotes:
              type: string
              writeOnly: true
              description: Never leaves Zone A — select:false and stripped in toJSON.
          required:
            - fullName
            - email
            - phone
    HQExecutive:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - type: object
          description: HQ executive profile — Zone B. Appointed by the Founder.
          properties:
            fullName:
              type: string
              maxLength: 160
            executiveTitle:
              type: string
            portfolio:
              type: array
              items:
                type: string
            regionsOverseen:
              type: array
              items:
                type: string
            serviceLinesOverseen:
              type: array
              items:
                type: string
            zonesVisible:
              type: array
              items:
                type: string
            reportsTo:
              type: string
              pattern: ^[a-f\d]{24}$
            appointedBy:
              type: string
              pattern: ^[a-f\d]{24}$
            appointmentDate:
              type: string
              format: date-time
            dashboardPreferences:
              type: object
              properties:
                defaultZone:
                  type: string
                pinnedKPIs:
                  type: array
                  items:
                    type: string
          required:
            - fullName
            - email
            - phone
            - executiveTitle
    BackOfficeStaff:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/VerificationFields'
        - '$ref': '#/components/schemas/IdentityFields'
        - '$ref': '#/components/schemas/EmergencyContactFields'
        - type: object
          description: Back office staff record — Zone C. The HR record for HQ people.
          properties:
            fullName:
              type: string
              maxLength: 160
            staffNumber:
              type: string
              maxLength: 24
            department:
              type: string
              enum:
                - humanResources
                - coordinatorOps
                - vendorOps
                - driverVerification
                - commercialOnboarding
                - financeSupport
                - complianceRecords
                - memberSupport
            jobTitle:
              type: string
            employmentType:
              type: string
              enum:
                - fullTime
                - partTime
                - contract
                - intern
            hireDate:
              type: string
              format: date-time
            exitDate:
              type: string
              format: date-time
            reportsTo:
              type: string
              pattern: ^[a-f\d]{24}$
            desksCovered:
              type: array
              items:
                type: string
            regionsServed:
              type: array
              items:
                type: string
          required:
            - fullName
            - email
            - phone
            - staffNumber
            - department
            - jobTitle
    Landlord:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/VerificationFields'
        - '$ref': '#/components/schemas/IdentityFields'
        - '$ref': '#/components/schemas/EmergencyContactFields'
        - type: object
          description: 'Landlord profile. `diasporaStatus` is load-bearing: payout currency, statement cadence and escalation all branch on it.'
          properties:
            fullName:
              type: string
              maxLength: 160
            propertiesOwned:
              type: array
              items:
                type: string
                pattern: ^[a-f\d]{24}$
            diasporaStatus:
              type: string
              enum:
                - resident
                - diaspora
                - returnee
                - dualBased
              default: resident
            payoutMethod:
              type: string
              enum:
                - mobileMoney
                - bankTransfer
                - cash
                - card
                - cheque
                - crypto
              default: bankTransfer
            payoutAccountRef:
              type: string
              writeOnly: true
            payoutCurrency:
              type: string
              enum:
                - GHS
                - USD
                - EUR
                - GBP
                - NGN
                - XOF
              default: GHS
            managementFeePercent:
              type: number
              minimum: 0
              maximum: 100
              default: 10
            statementFrequency:
              type: string
              enum:
                - monthly
                - quarterly
                - annually
          required:
            - fullName
            - email
            - phone
    Tenant:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/VerificationFields'
        - '$ref': '#/components/schemas/IdentityFields'
        - '$ref': '#/components/schemas/EmergencyContactFields'
        - type: object
          description: Tenant profile. Lease fields are optional at creation — Back Office often onboards a tenant before the lease is signed.
          properties:
            fullName:
              type: string
              maxLength: 160
            occupation:
              type: string
            employerName:
              type: string
            employerContact:
              type: string
            monthlyIncome:
              type: number
              minimum: 0
              writeOnly: true
            property:
              type: string
              pattern: ^[a-f\d]{24}$
            unitLabel:
              type: string
            leaseStart:
              type: string
              format: date-time
            leaseEnd:
              type: string
              format: date-time
            monthlyRent:
              type: number
              minimum: 0
            rentCurrency:
              type: string
              enum:
                - GHS
                - USD
                - EUR
                - GBP
                - NGN
                - XOF
              default: GHS
            securityDeposit:
              type: number
              minimum: 0
            paymentMethod:
              type: string
              enum:
                - mobileMoney
                - bankTransfer
                - cash
                - card
                - cheque
                - crypto
              default: mobileMoney
            rentDueDay:
              type: integer
              minimum: 1
              maximum: 31
              default: 1
            complianceScore:
              type: number
              minimum: 0
              maximum: 100
              readOnly: true
            onTimePaymentRate:
              type: number
              minimum: 0
              maximum: 100
              readOnly: true
            engagementScore:
              type: number
              minimum: 0
              maximum: 100
              readOnly: true
            leaseDaysRemaining:
              type: integer
              readOnly: true
              nullable: true
          required:
            - fullName
            - email
            - phone
    Coordinator:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/VerificationFields'
        - '$ref': '#/components/schemas/IdentityFields'
        - '$ref': '#/components/schemas/RatingFields'
        - type: object
          description: Coordinator profile — the LRMC field officer. `areasCovered` is what confines them.
          properties:
            fullName:
              type: string
              maxLength: 160
            areasCovered:
              type: array
              items:
                type: string
            assignedProperties:
              type: array
              items:
                type: string
                pattern: ^[a-f\d]{24}$
            skills:
              type: array
              items:
                type: string
            languages:
              type: array
              items:
                type: string
            availabilitySchedule:
              type: string
            availabilityWindows:
              type: array
              items:
                type: object
                properties:
                  day:
                    type: string
                    enum:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                  from:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                  to:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                required:
                  - day
                  - from
                  - to
            completedTasks:
              type: integer
              minimum: 0
              readOnly: true
            openTasks:
              type: integer
              minimum: 0
              readOnly: true
            onTimeCompletionRate:
              type: number
              minimum: 0
              maximum: 100
              readOnly: true
            employmentType:
              type: string
              enum:
                - staff
                - contract
                - volunteer
            startDate:
              type: string
              format: date-time
          required:
            - fullName
            - email
            - phone
    Vendor:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/VerificationFields'
        - '$ref': '#/components/schemas/IdentityFields'
        - '$ref': '#/components/schemas/RatingFields'
        - type: object
          description: Vendor profile — service provider for LRMC properties and Ususu fleets.
          properties:
            fullName:
              type: string
              maxLength: 160
            businessName:
              type: string
              maxLength: 200
            serviceType:
              type: string
              enum:
                - plumbing
                - electrical
                - carpentry
                - masonry
                - painting
                - cleaning
                - landscaping
                - pestControl
                - security
                - hvac
                - appliance
                - roofing
                - generalMaintenance
                - vehicleMaintenance
                - other
            secondaryServiceTypes:
              type: array
              items:
                type: string
            areasCovered:
              type: array
              items:
                type: string
            skills:
              type: array
              items:
                type: string
            toolsAvailable:
              type: array
              items:
                type: string
            serviceRates:
              type: string
            rateCard:
              type: array
              items:
                type: object
                properties:
                  item:
                    type: string
                  unit:
                    type: string
                    default: job
                  amount:
                    type: number
                    minimum: 0
                  currency:
                    type: string
                    enum:
                      - GHS
                      - USD
                      - EUR
                      - GBP
                      - NGN
                      - XOF
                required:
                  - item
                  - amount
            completedJobs:
              type: integer
              minimum: 0
              readOnly: true
            openJobs:
              type: integer
              minimum: 0
              readOnly: true
            averageResponseHours:
              type: number
              minimum: 0
            businessRegistrationNumber:
              type: string
            taxIdentificationNumber:
              type: string
              writeOnly: true
            insured:
              type: boolean
          required:
            - fullName
            - email
            - phone
            - businessName
            - serviceType
    Driver:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LocationFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/VerificationFields'
        - '$ref': '#/components/schemas/IdentityFields'
        - '$ref': '#/components/schemas/EmergencyContactFields'
        - '$ref': '#/components/schemas/RatingFields'
        - type: object
          description: Ususu driver. Licence and insurance expiry are first-class so the verification queue can be driven off them.
          properties:
            fullName:
              type: string
              maxLength: 160
            driverLicenseNumber:
              type: string
              writeOnly: true
            driverLicensePhoto:
              type: string
              writeOnly: true
            driverLicenseExpiry:
              type: string
              format: date-time
            vehicleType:
              type: string
              enum:
                - sedan
                - hatchback
                - suv
                - minivan
                - pickup
                - motorcycle
                - tricycle
                - bus
                - luxury
            vehicleMake:
              type: string
            vehicleModel:
              type: string
            vehicleYear:
              type: integer
              minimum: 1970
            vehicleColor:
              type: string
            vehiclePlate:
              type: string
            vehiclePhotos:
              type: array
              items:
                type: string
            insurancePhoto:
              type: string
              writeOnly: true
            insuranceExpiry:
              type: string
              format: date-time
            roadworthyExpiry:
              type: string
              format: date-time
            ownedBy:
              type: string
              pattern: ^[a-f\d]{24}$
              description: Rental car company operating this vehicle, if any.
            areasCovered:
              type: array
              items:
                type: string
            completedRides:
              type: integer
              minimum: 0
              readOnly: true
            cancelledRides:
              type: integer
              minimum: 0
              readOnly: true
            acceptanceRate:
              type: number
              minimum: 0
              maximum: 100
              readOnly: true
            isOnline:
              type: boolean
              readOnly: true
            lastOnlineAt:
              type: string
              format: date-time
              readOnly: true
            payoutMethod:
              type: string
              enum:
                - mobileMoney
                - bankTransfer
                - cash
                - card
                - cheque
                - crypto
            payoutAccountRef:
              type: string
              writeOnly: true
            documentsCurrent:
              type: boolean
              readOnly: true
            dispatchable:
              type: boolean
              readOnly: true
              description: verified AND active AND licence/insurance unexpired.
          required:
            - fullName
            - email
            - phone
            - vehicleType
    Rider:
      allOf:
        - '$ref': '#/components/schemas/ContactFields'
        - '$ref': '#/components/schemas/LifecycleFields'
        - '$ref': '#/components/schemas/RatingFields'
        - '$ref': '#/components/schemas/EmergencyContactFields'
        - type: object
          description: 'Ususu rider — deliberately the lightest profile. No ID, no verification: signup friction is the enemy of a rideshare marketplace.'
          properties:
            fullName:
              type: string
              maxLength: 160
            preferredPaymentMethod:
              type: string
              enum:
                - mobileMoney
                - bankTransfer
                - cash
                - card
                - cheque
                - crypto
              default: mobileMoney
            savedPlaces:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                    maxLength: 60
                  address:
                    type: string
                    maxLength: 400
                  longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                  latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                required:
                  - label
                  - address
            rideHistory:
              type: array
              items:
                type: string
                pattern: ^[a-f\d]{24}$
              readOnly: true

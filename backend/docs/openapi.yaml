      properties:
        counted:
          type: boolean
      required:
        - counted
    TrackAccepted:
      type: object
      properties:
        recorded:
          type: boolean
      required:
        - recorded
    RotationPreview:
      type: object
      description: 'Dry-run of the rotation engine: what would serve now, and at what weight.'
      properties:
        zone:
          type: string
        policy:
          type: object
          properties:
            pacingEnabled:
              type: boolean
            maxAdvertiserSharePercent:
              type: number
            bannedCategories:
              type: array
              items:
                type: string
            houseAdOnlyZones:
              type: array
              items:
                type: string
        wouldServe:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[a-f\d]{24}$
              title:
                type: string
              advertiserName:
                type: string
              category:
                type: string
              effectiveWeight:
                type: number
    TrafficMetrics:
      type: object
      properties:
        windowDays:
          type: integer
        pageViews:
          type: integer
        sessions:
          type: integer
        conversions:
          type: integer
        conversionRatePercent:
          type: number
        byDomain:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              views:
                type: integer
        topPaths:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              views:
                type: integer
        byGoal:
          type: array
          items:
            type: object
            properties:
              goal:
                type: string
              count:
                type: integer
        byDevice:
          type: array
          items:
            type: object
            properties:
              device:
                type: string
              count:
                type: integer
    PlatformIndex:
      type: object
      properties:
        platform:
          type: string
        version:
          type: string
        environment:
          type: string
          enum:
            - development
            - test
            - production
        roles:
          type: array
          items:
            type: string
        hqZones:
          type: array
          items:
            '$ref': '#/components/schemas/HQZone'
        endpoints:
          type: array
          items:
            type: string
        blueprint:
          type: string
        openapi:
          type: string
    BlueprintEndpoint:
      type: object
      properties:
        method:
          type: string
          enum:
            - GET
            - POST
            - PATCH
            - PUT
            - DELETE
        path:
          type: string
        module:
          type: string
        summary:
          type: string
        zone:
          type: string
          nullable: true
        auth:
          type: string
          enum:
            - required
            - optional
            - none
        permissions:
          type: array
          items:
            type: string
        ownership:
          type: string
          enum:
            - none
            - scoped
            - self
        requestBody:
          type: string
        requestQuery:
          type: string
        responseShape:
          type: string
        surface:
          type: string
          enum:
            - profile
            - custom
        roles:
          type: array
          items:
            type: string
          description: Only present when a founder passes ?all=true.
    BlueprintResponse:
      type: object
      description: The live contract, filtered to what the caller can reach. What the PWA shells build navigation and route guards from.
      properties:
        prefix:
          type: string
        total:
          type: integer
        reachable:
          type: integer

    ReverifyDocumentRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000
    PayoutLine:
      type: object
      description: One payee, one currency, one transfer. Amounts are frozen at build time, not recomputed from rows that may since have been refunded.
      properties:
        _id:
          type: string
          pattern: ^[a-f\d]{24}$
        payee:
          type: string
          pattern: ^[a-f\d]{24}$
        payeeKind:
          type: string
        currency:
          type: string
          enum:
            - GHS
            - USD
            - EUR
            - GBP
            - NGN
            - XOF
        sourcePayments:
          type: array
          items:
            type: string
            pattern: ^[a-f\d]{24}$
        gross:
          type: number
          minimum: 0
        platformFee:
          type: number
          minimum: 0
        net:
          type: number
          minimum: 0
        transferStatus:
          type: string
          enum:
            - pending
            - processing
            - settled
            - failed
            - reversed
        providerReference:
          type: string
          readOnly: true
        failureReason:
          type: string
          readOnly: true
        settledAt:
          type: string
          format: date-time
      required:
        - payee
        - currency
        - gross
        - net
        - transferStatus
    PayoutLineList:
      type: array
      items:
        '$ref': '#/components/schemas/PayoutLine'
    PayoutBatch:
      allOf:
        - '$ref': '#/components/schemas/LifecycleFields'
        - type: object
          description: 'A batch of outbound transfers built from settled ledger rows. Separate from Payment: the ledger records money that has moved, a batch is an instruction to move some.'
          properties:
            _id:
              type: string
              pattern: ^[a-f\d]{24}$
            reference:
              type: string
              readOnly: true
              description: PYT-xxxxxx, server-assigned.
            kind:
              type: string
              enum:
                - driverPayout
                - landlordPayout
                - refund
            currency:
              type: string
              enum:
                - GHS
                - USD
                - EUR
                - GBP
                - NGN
                - XOF
            periodStart:
              type: string
              format: date-time
            periodEnd:
              type: string
              format: date-time
            lines:
              type: array
              items:
                '$ref': '#/components/schemas/PayoutLine'
            lineCount:
              type: integer
              minimum: 0
              readOnly: true
            gross:
              type: number
              minimum: 0
              readOnly: true
            platformFee:
              type: number
              minimum: 0
              readOnly: true
            net:
              type: number
              minimum: 0
              readOnly: true
            approvedBy:
              type: string
              pattern: ^[a-f\d]{24}$
            approvedAt:
              type: string
              format: date-time
            settledAt:
              type: string
              format: date-time
            skipped:
              type: array
              items:
                type: object
                properties:
                  payment:
                    type: string
                    pattern: ^[a-f\d]{24}$
                  reason:
                    type: string
            notes:
              type: string
              maxLength: 2000
            status:
              type: string
              enum:
                - draft
                - approved
                - settling
                - settled
                - partiallySettled
                - failed
                - cancelled
              readOnly: true
            settledLineCount:
              type: integer
              minimum: 0
              readOnly: true
          required:
            - kind
            - currency
            - lineCount
            - gross
            - net
            - status
    PayoutBatchList:
      type: array
      items:
        '$ref': '#/components/schemas/PayoutBatch'
    BuildPayoutBatchRequest:
      type: object

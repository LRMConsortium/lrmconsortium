x-hq-zones:
  - code: A
    key: FOUNDER_COMMAND_CENTER
    label: Founder Command Center
    purpose: Constitutional layer. Writes rules, regulations and policy; approves system-wide change; owns ad pricing and rotation policy; oversees every region and service.
    surfaces:
      - founder-console
  - code: B
    key: HQ_EXECUTIVE
    label: HQ Executive Layer
    purpose: 'Sees the whole institution and steers it: high-level dashboards, KPIs, analytics and system health. Reads into Back Office, Member Portal and public metrics.'
    surfaces:
      - hq-dashboard
  - code: C
    key: BACK_OFFICE
    label: Back Office (HR & Staff)
    purpose: Operational engine room. Owns coordinator, vendor and staff records, Ususu driver verification, and commercial-client onboarding for Airbnb hosts, hotels, resorts and rental car companies.
    surfaces:
      - back-office
  - code: D
    key: MEMBER_PORTAL
    label: Member Portal
    purpose: 'Where members live: their own profile, their performance, residency, rent, compliance and engagement history.'
    surfaces:
      - member-portal
      - ususu-app
  - code: E
    key: PUBLIC_PORTAL
    label: Public Portal
    purpose: 'The face of the consortium: website stats, traffic analytics, conversion metrics, public content, and ad placement with rotation.'
    surfaces:
      - public-web
      - ususu-marketing
x-roles-catalogue:
  - founder
  - hqExecutive
  - backOfficeStaff
  - coordinator
  - vendor
  - landlord
  - tenant
  - airbnbHost
  - hotelManager
  - resortManager
  - rentalCarCompany
  - driver
  - rider
  - advertiser
  - publicUser
